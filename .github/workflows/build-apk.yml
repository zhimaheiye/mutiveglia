name: Build Veglia APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Environment
        run: |
          ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          if [ -z "$ANDROID_HOME" ]; then
            ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          
          if [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          else
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          fi

          if [ -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
            PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"
          else
            LATEST_PLAT=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
            PLATFORM="$LATEST_PLAT/android.jar"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> $GITHUB_ENV
          echo "PLATFORM=$PLATFORM" >> $GITHUB_ENV
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/android" >> $GITHUB_ENV
          echo "OUT_DIR=$GITHUB_WORKSPACE/android/build" >> $GITHUB_ENV
          echo "SRC_DIR=$GITHUB_WORKSPACE/android/app/src/main" >> $GITHUB_ENV
          
          echo "=== Environment Info ==="
          echo "Using BUILD_TOOLS: $BUILD_TOOLS"
          echo "Using PLATFORM: $PLATFORM"

      - name: Compile resources (aapt2 compile)
        run: |
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR/gen" "$OUT_DIR/classes" "$OUT_DIR/apk" "$OUT_DIR/compiled_res"
          "$BUILD_TOOLS/aapt2" compile --dir "$SRC_DIR/res" -o "$OUT_DIR/compiled_res/"
          echo "Compiled resources:"
          ls -la "$OUT_DIR/compiled_res"

      - name: Link resources (aapt2 link)
        run: |
          "$BUILD_TOOLS/aapt2" link \
            -o "$OUT_DIR/apk/app.unsigned.apk" \
            -I "$PLATFORM" \
            --manifest "$SRC_DIR/AndroidManifest.xml" \
            --java "$OUT_DIR/gen" \
            --auto-add-overlay \
            "$OUT_DIR/compiled_res"/*.flat
          echo "Generated APK:"
          ls -lh "$OUT_DIR/apk/app.unsigned.apk"
          echo "Generated Java files:"
          find "$OUT_DIR/gen" -type f

      - name: Compile Java (javac)
        run: |
          find "$SRC_DIR/java" -name "*.java" > "$OUT_DIR/sources.txt"
          find "$OUT_DIR/gen" -name "*.java" >> "$OUT_DIR/sources.txt"
          echo "Java source files to compile:"
          cat "$OUT_DIR/sources.txt"

          javac \
            -encoding UTF-8 \
            -source 11 -target 11 \
            -classpath "$PLATFORM" \
            -d "$OUT_DIR/classes" \
            @"$OUT_DIR/sources.txt"
          echo "Compiled classes:"
          find "$OUT_DIR/classes" -type f

      - name: Convert to DEX (d8)
        run: |
          jar cf "$OUT_DIR/classes.jar" -C "$OUT_DIR/classes" .
          "$BUILD_TOOLS/d8" \
            --output "$OUT_DIR/apk/" \
            --lib "$PLATFORM" \
            "$OUT_DIR/classes.jar"
          echo "Created DEX:"
          ls -lh "$OUT_DIR/apk/classes.dex"

      - name: Package APK (jar)
        run: |
          cd "$OUT_DIR/apk"
          cp app.unsigned.apk app.tmp.apk
          jar uf app.tmp.apk classes.dex
          mv app.tmp.apk app.unsigned.apk
          echo "Packaged unsigned APK:"
          ls -lh app.unsigned.apk

      - name: Align and Sign APK (zipalign & apksigner)
        run: |
          cd "$OUT_DIR/apk"
          echo "=== Zipalign ==="
          "$BUILD_TOOLS/zipalign" -f 4 app.unsigned.apk app.aligned.apk
          ls -lh app.aligned.apk

          echo "=== Checking Keystore ==="
          if [ ! -f "$PROJECT_DIR/debug.jks" ]; then
            echo "debug.jks not found, creating debug key..."
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/debug.jks" \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -alias veglia \
              -storepass veglia-debug \
              -keypass veglia-debug \
              -dname "CN=Veglia Debug"
          fi

          echo "=== Signing APK ==="
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$PROJECT_DIR/debug.jks" \
            --ks-pass pass:veglia-debug \
            --key-pass pass:veglia-debug \
            --ks-key-alias veglia \
            --out "$PROJECT_DIR/Veglia.apk" \
            app.aligned.apk

          echo "=== Verifying Signature ==="
          "$BUILD_TOOLS/apksigner" verify -v "$PROJECT_DIR/Veglia.apk"

          echo "Signed final APK:"
          ls -lh "$PROJECT_DIR/Veglia.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veglia-apk
          path: android/Veglia.apk
          retention-days: 14
